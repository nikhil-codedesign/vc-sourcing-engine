name: Filter

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "gold = only your labeled sample (fast, for tuning the prompt). all = every company."
        type: choice
        options:
          - all
          - gold
        default: all

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Filter with the AI model
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          FILTER_SCOPE: ${{ inputs.scope }}
        run: python src/filter_signals.py

      - name: Save results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update filter results"
          git pull --rebase origin main
          git push

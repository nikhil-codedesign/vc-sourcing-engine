name: Ingest

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"   # every day at 01:30 UTC = 07:00 India time

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Collect GitHub signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/ingest_github.py

      - name: Collect Hacker News signals
        run: python src/ingest_hn.py

      - name: Merge and remove duplicates
        run: python src/dedupe.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update signals"
          git pull --rebase origin main
          git push
